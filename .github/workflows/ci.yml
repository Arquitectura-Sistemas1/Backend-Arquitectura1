name: CI/CD Pipeline - Backend

on:
  push:
    branches: [ "develop", "main", "Develop" ]
  pull_request:
    branches: [ "develop", "main", "Develop" ]

jobs:
  # ESTO DE LA INTEGRACIÓN CONTINUA (CI) 
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar archivos obligatorios
        run: |
          test -f Dockerfile || (echo "ERROR: Falta Dockerfile" && exit 1)
          test -f .env.example || (echo "ERROR: Falta .env.example" && exit 1)
          test -f README.md || (echo "ERROR: Falta README.md" && exit 1)

      - name: Validar compilacion de Dockerfile Backend
        run: docker build -t backend-app-test .

  # ESTO ES DE DESPLIEGUE CONTINUO: DESARROLLO (Ubuntu Server / Tailscale)
  deploy-dev:
    name: Despliegue a Entorno de Desarrollo
    needs: build-and-validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/Develop')
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Conectar a la VPN de Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.68.0

      - name: Desplegar en Ubuntu Server vía SSH sobre Tailscale
        env:
          SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          DEV_HOST: ${{ secrets.DEV_SERVER_HOST }}
          DEV_USER: ${{ secrets.DEV_SERVER_USER }}
        run: |
          # Configurar la llave SSH de forma segura en el runner
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Configurar SSH para que use el túnel integrado de Tailscale (ProxyCommand)
          cat <<EOF > ~/.ssh/config
          Host dev-server
              HostName $DEV_HOST
              User $DEV_USER
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking no
              ProxyCommand tailscale nc %h %p
          EOF

          # Ejecutar los comandos en el servidor remoto usando el túnel de Tailscale
          ssh dev-server << 'EOF'
            cd /home/Brxckin/Backend-Arquitectura1
            git pull origin Develop
            docker build -t backend-dev .
            docker stop backend-dev-container || true
            docker rm backend-dev-container || true
            docker run -d --name backend-dev-container -p 8080:8080 backend-dev
          EOF

  # ESTO ES DEL DESPLIEGUE CONTINUO: PRODUCCIÓN (Oracle Cloud)
  deploy-prod:
    name: Despliegue a Producción (OCI)
    needs: build-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Desplegar en Oracle Cloud vía SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /home/Brxckin/Backend-Arquitectura1
            git pull origin main
            docker build -t backend-prod .
            docker stop backend-prod-container || true
            docker rm backend-prod-container || true
            docker run -d --name backend-prod-container -p 80:8080 backend-prod